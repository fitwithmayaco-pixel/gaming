<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark GTA-style background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0b18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
    <!-- Neon pink-orange gradient for VI text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff007a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff5e00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d00ff;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff007a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)"/>

  <!-- Neon border ring -->
  <rect width="62" height="62" x="1" y="1" rx="13" ry="13" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- Inner subtle glow circle -->
  <circle cx="32" cy="32" r="24" fill="#ff007a" opacity="0.06"/>

  <!-- GTA VI text: italic bold "VI" centered -->
  <text
    x="32"
    y="44"
    text-anchor="middle"
    font-family="Arial Black, Impact, sans-serif"
    font-size="34"
    font-weight="900"
    font-style="italic"
    fill="url(#textGrad)"
    filter="url(#glow)"
    letter-spacing="-1"
  >VI</text>

  <!-- Subtle scanline bars for GTA aesthetic -->
  <line x1="4" y1="20" x2="60" y2="20" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  <line x1="4" y1="28" x2="60" y2="28" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  <line x1="4" y1="36" x2="60" y2="36" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  <line x1="4" y1="44" x2="60" y2="44" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  <line x1="4" y1="52" x2="60" y2="52" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
</svg>
